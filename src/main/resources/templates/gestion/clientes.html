<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Clientes')}"></head>
<style>
    .field-error { color:#dc2626;font-size:11px;margin-top:4px;display:none;font-weight:500; }
    .field-error.visible { display:block; }
    .form-group input.error, .form-group select.error { border-color:#dc2626!important;background:#fff5f5; }
    .form-group input.ok { border-color:#059669!important; }
    .modal-xl { max-width:720px!important; }
    .modal-section { background:#f8fafc;border-radius:8px;padding:16px;margin-bottom:16px; }
    .modal-section-title { font-size:11px;font-weight:700;color:#4C97D2;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px; }
    .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
    .grid-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px; }
    .form-group { margin-bottom:0; }
    .form-group label { display:block;font-size:11px;font-weight:700;color:#12274B;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px; }
    .form-group input, .form-group select { width:100%;padding:9px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B;transition:border-color .2s;box-sizing:border-box; }
    .form-group input:focus, .form-group select:focus { border-color:#1468B1; }
    .field-locked { background:#f0f4f8!important;cursor:not-allowed!important;color:#888!important; }
    .ruc-hint { font-size:11px;color:#4C97D2;margin-top:4px;display:none; }
    .ruc-hint.visible { display:block; }

    /* ── Confirm modal ── */
    #confirmOverlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center; }
    #confirmOverlay.open { display:flex; }
    #confirmBox { background:#fff;border-radius:12px;padding:28px 32px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center; }
    #confirmMsg { font-size:15px;font-weight:600;color:#12274B;margin-bottom:20px; }
</style>
<body>
<div th:replace="~{layout :: sidebar('clientes')}"></div>

<div class="main">
    <div class="topbar">
        <h1><i class="bi bi-person-lines-fill"></i> Clientes</h1>
        <span class="user-badge" id="userDisplay"></span>
    </div>

    <div class="card-box">
        <div class="card-box-header">
            <h2>Listado de Clientes</h2>
            <button class="btn btn-primary" onclick="abrirModalNuevo()"><i class="bi bi-person-plus-fill"></i> Nuevo Cliente</button>
        </div>

        <div style="display:flex;gap:12px;padding:16px 24px;border-bottom:1px solid #f0f4f8;flex-wrap:wrap;">
            <select id="filtroCampo" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B;min-width:160px">
                <option value="">Buscar por...</option>
                <option value="nombre">Nombre</option>
                <option value="identificacion">Identificación</option>
                <option value="correo">Correo</option>
            </select>
            <div style="position:relative;flex:1;min-width:200px;">
                <input type="text" id="buscador" placeholder="Buscar cliente..."
                   oninput="resetPagina()"
                   style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;width:100%;box-sizing:border-box;padding-right:28px;outline:none;color:#12274B"/>
                <button id="buscadorClear" onclick="document.getElementById('buscador').value='';document.getElementById('buscadorClear').style.display='none';resetPagina()" title="Limpiar búsqueda" style="position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:17px;line-height:1;padding:0;display:none;">&#x2715;</button>
            </div>
            <select id="filtroEstado" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B;min-width:140px">
                <option value="">Todos</option>
                <option value="true">Activos</option>
                <option value="false">Inactivos</option>
            </select>
            <select id="filtroSize" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B">
                <option value="10">10 por página</option>
                <option value="25">25 por página</option>
                <option value="50">50 por página</option>
            </select>
        </div>

        <table>
            <thead>
            <tr>
                <th>Tipo / Identificación</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaClientes">
            <tr><td colspan="7" style="text-align:center;color:#aaa;padding:30px">Cargando...</td></tr>
            </tbody>
        </table>

        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid #f0f4f8;">
            <span id="infoPagina" style="font-size:13px;color:#888"></span>
            <div style="display:flex;gap:6px;" id="controlesPagina"></div>
        </div>
    </div>
</div>

<!-- Modal Cliente -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal modal-xl">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
            <h3 id="modalTitulo" style="margin:0;font-size:17px;color:#12274B;">Nuevo Cliente</h3>
            <button onclick="cerrarModal()" style="background:none;border:none;cursor:pointer;font-size:22px;color:#888;line-height:1;">×</button>
        </div>
        <input type="hidden" id="clienteId"/>

        <!-- Identificación -->
        <div class="modal-section">
            <div class="modal-section-title">Identificación</div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Tipo de Identificación</label>
                    <select id="tipoIdentificacion" onchange="onTipoChange()">
                        <option value="CEDULA">Cédula (10 dígitos)</option>
                        <option value="RUC">RUC (13 dígitos)</option>
                        <option value="PASAPORTE">Pasaporte</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Número de Identificación</label>
                    <input type="text" id="identificacion" placeholder="Ej: 1234567890"
                           oninput="validarIdentificacion()" onblur="validarIdentificacion()"/>
                    <span class="field-error" id="err-identificacion"></span>
                    <span class="ruc-hint" id="ruc-hint"><i class="bi bi-lock-fill"></i> RUC generado automáticamente a partir de la cédula</span>
                </div>
            </div>
        </div>

        <!-- Datos personales -->
        <div class="modal-section">
            <div class="modal-section-title">Datos Personales</div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Nombres <span style="color:#dc2626">*</span></label>
                    <input type="text" id="nombres" placeholder="JUAN PABLO" maxlength="60"
                           oninput="autoMayus(this);validarTexto(this,'err-nombres','Nombres')"
                           onblur="validarTexto(this,'err-nombres','Nombres')"/>
                    <span class="field-error" id="err-nombres"></span>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" id="apellidos" placeholder="PÉREZ TORRES" maxlength="60"
                           oninput="autoMayus(this)" onblur="autoMayus(this)"/>
                </div>
            </div>
            <div class="grid-2" style="margin-top:14px;">
                <div class="form-group">
                    <label>Correo Electrónico <span style="color:#ef4444">*</span></label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" maxlength="80"
                           oninput="this.value=this.value.toLowerCase();validarCorreo()" onblur="validarCorreo()"/>
                    <span class="field-error" id="err-correo"></span>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="telefono" placeholder="0999999999" maxlength="15"
                           oninput="validarTelefono()" onblur="validarTelefono()"/>
                    <span class="field-error" id="err-telefono"></span>
                </div>
            </div>
            <div class="form-group" style="margin-top:14px;">
                <label>Dirección</label>
                <input type="text" id="direccion" placeholder="AV. PRINCIPAL 123" maxlength="120"
                       oninput="autoMayus(this)" onblur="autoMayus(this)"/>
            </div>
        </div>

        <div class="modal-footer" style="margin-top:8px;">
            <button class="btn" onclick="cerrarModal()" style="background:#f0f4f8;color:#333">Cancelar</button>
            <button class="btn btn-primary" id="btnGuardar" onclick="solicitarGuardarCliente()"><i class="bi bi-floppy2-fill"></i> Guardar Cliente</button>
        </div>
    </div>
</div>

<!-- Confirm Modal -->
<div id="confirmOverlay">
    <div id="confirmBox">
        <div id="confirmIcon" style="font-size:36px;margin-bottom:10px;"></div>
        <div id="confirmMsg" style="font-size:14px;font-weight:600;color:#12274B;margin-bottom:20px;"></div>
        <div style="display:flex;gap:12px;justify-content:center;">
            <button class="btn" id="confirmNo" style="background:#f0f4f8;color:#333;min-width:90px">Cancelar</button>
            <button class="btn btn-primary" id="confirmSi" style="min-width:90px">Confirmar</button>
        </div>
    </div>
</div>

<!-- Alert Modal -->
<div id="alertOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:12px;padding:28px 32px;max-width:360px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center;">
        <div id="alertIcon" style="font-size:36px;margin-bottom:10px;"></div>
        <div id="alertMsg" style="font-size:14px;color:#333;margin-bottom:20px;line-height:1.5;"></div>
        <button class="btn btn-primary" onclick="cerrarAlerta()" style="min-width:90px">Aceptar</button>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
    if (rol === 'CAJERO')    window.location.href = '/ventas';
    if (rol === 'BODEGUERO') window.location.href = '/inventario';

    let paginaActual = 0;
    let totalPaginas = 0;
    let esEdicion = false;
    let tipoOriginal = '';
    let identificacionOriginal = '';

    function resetPagina() { paginaActual = 0; cargarDatos(); }

    // ── Alert modal ────────────────────────────────────────────────
    const _cliIconMap = {
        success: '<i class="bi bi-check-circle-fill" style="color:#059669;font-size:36px"></i>',
        error:   '<i class="bi bi-x-circle-fill" style="color:#dc2626;font-size:36px"></i>',
        warning: '<i class="bi bi-exclamation-triangle-fill" style="color:#d97706;font-size:36px"></i>',
        info:    '<i class="bi bi-info-circle-fill" style="color:#1468B1;font-size:36px"></i>',
    };
    function mostrarAlerta(msg, tipo) {
        document.getElementById('alertIcon').innerHTML = _cliIconMap[tipo] || _cliIconMap['info'];
        document.getElementById('alertMsg').textContent = msg;
        document.getElementById('alertOverlay').style.display = 'flex';
    }
    function cerrarAlerta() { document.getElementById('alertOverlay').style.display = 'none'; }

    // ── Confirm modal ──────────────────────────────────────────────
    function confirmar(mensaje, callback) {
        document.getElementById('confirmIcon').innerHTML = _cliIconMap['warning'];
        document.getElementById('confirmMsg').textContent = mensaje;
        document.getElementById('confirmOverlay').classList.add('open');
        const btnSi = document.getElementById('confirmSi');
        const btnNo = document.getElementById('confirmNo');
        const cerrar = () => document.getElementById('confirmOverlay').classList.remove('open');
        btnSi.onclick = () => { cerrar(); callback(); };
        btnNo.onclick = cerrar;
    }

    // ── Carga de datos ─────────────────────────────────────────────
    async function cargarDatos() {
        const h      = authHeaders();
        const search = document.getElementById('buscador').value;
        const campo  = document.getElementById('filtroCampo').value;
        const size   = document.getElementById('filtroSize').value;
        const estado = document.getElementById('filtroEstado').value;

        let url = `/api/clientes/paginado?page=${paginaActual}&size=${size}`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (campo) url += `&campo=${encodeURIComponent(campo)}`;

        try {
            const res  = await fetch(url, {headers: h});
            const data = await res.json();
            let page   = data.datos ?? data;
            let contenido = page.contenido ?? [];

            if (estado !== '') contenido = contenido.filter(c => String(c.activo) === estado);

            totalPaginas = page.totalPaginas;

            document.getElementById('infoPagina').textContent =
                `Mostrando ${contenido.length} de ${page.totalElementos} clientes — Página ${page.paginaActual + 1} de ${page.totalPaginas || 1}`;

            if (!contenido.length) {
                document.getElementById('tablaClientes').innerHTML =
                    '<tr><td colspan="7" style="text-align:center;color:#aaa;padding:30px">No se encontraron clientes</td></tr>';
                document.getElementById('controlesPagina').innerHTML = '';
                return;
            }

            document.getElementById('tablaClientes').innerHTML = contenido.map(c => `
                <tr>
                    <td>
                        <span style="font-size:10px;font-weight:700;color:#4C97D2;background:#e8f4fd;padding:2px 6px;border-radius:4px;">${c.tipoIdentificacion}</span><br/>
                        <span style="font-size:13px;margin-top:2px;display:inline-block">${c.identificacion}</span>
                    </td>
                    <td>${c.nombres}</td>
                    <td>${c.apellidos ?? '-'}</td>
                    <td style="font-size:12px">${c.correo ?? '-'}</td>
                    <td>${c.telefono ?? '-'}</td>
                    <td><span class="badge ${c.activo ? 'badge-success' : 'badge-danger'}">${c.activo ? 'Activo' : 'Inactivo'}</span></td>
                    <td style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button class="btn btn-primary btn-sm" onclick="editarCliente(${c.idCliente})"><i class="bi bi-pencil-fill"></i> Editar</button>
                        <button class="btn btn-sm" onclick="solicitarCambioEstado(${c.idCliente}, ${!c.activo})"
                            style="background:${c.activo ? '#fee2e2' : '#d1fae5'};color:${c.activo ? '#dc2626' : '#065f46'}">
                            ${c.activo ? '<i class="bi bi-toggle-off"></i> Desactivar' : '<i class="bi bi-toggle-on"></i> Activar'}
                        </button>
                    </td>
                </tr>
            `).join('');

            renderPaginacion();
        } catch(e) { console.error(e); }
    }

    function renderPaginacion() {
        const cont = document.getElementById('controlesPagina');
        let html = `<button class="btn btn-sm" onclick="irPagina(${paginaActual-1})"
            ${paginaActual===0?'disabled style="opacity:0.4"':''}
            style="background:#f0f4f8;color:#333">Anterior</button>`;
        for (let i = 0; i < totalPaginas; i++) {
            if (totalPaginas <= 7 || Math.abs(i-paginaActual) <= 2)
                html += `<button class="btn btn-sm" onclick="irPagina(${i})"
                    style="background:${i===paginaActual?'#1468B1':'#f0f4f8'};color:${i===paginaActual?'white':'#333'}">${i+1}</button>`;
        }
        html += `<button class="btn btn-sm" onclick="irPagina(${paginaActual+1})"
            ${paginaActual>=totalPaginas-1?'disabled style="opacity:0.4"':''}
            style="background:#f0f4f8;color:#333">Siguiente</button>`;
        cont.innerHTML = html;
    }

    function irPagina(p) { if (p>=0 && p<totalPaginas) { paginaActual=p; cargarDatos(); } }

    // ── Validaciones ───────────────────────────────────────────────
    function autoMayus(el) {
        const pos = el.selectionStart;
        el.value = el.value.toUpperCase();
        try { el.setSelectionRange(pos, pos); } catch(e){}
    }

    function mostrarError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.classList.toggle('visible', !!msg);
        const input = el.previousElementSibling;
        if (input && (input.tagName==='INPUT' || input.tagName==='SELECT')) {
            input.classList.toggle('error', !!msg);
            input.classList.toggle('ok', !msg && input.value.trim() !== '');
        }
    }

    function onTipoChange() {
        const tipo = document.getElementById('tipoIdentificacion').value;
        const inp  = document.getElementById('identificacion');
        const hint = document.getElementById('ruc-hint');

        if (esEdicion) {
            if (tipoOriginal === 'CEDULA' && tipo === 'RUC') {
                // CEDULA → RUC: agrega 001
                inp.value = identificacionOriginal + '001';
                inp.readOnly = true;
                inp.classList.add('field-locked');
                hint.classList.add('visible');
            } else if (tipoOriginal === 'RUC' && tipo === 'CEDULA') {
                // RUC → CEDULA: quita los últimos 3 dígitos (001)
                inp.value = identificacionOriginal.slice(0, -3);
                inp.readOnly = true;
                inp.classList.add('field-locked');
                hint.classList.remove('visible');
            } else {
                // Sin cambio de tipo: restaurar original
                inp.value = identificacionOriginal;
                inp.readOnly = true;
                inp.classList.add('field-locked');
                hint.classList.remove('visible');
            }
            mostrarError('err-identificacion', '');
            return;
        }

        // Modo nuevo: actualizar placeholder
        hint.classList.remove('visible');
        if (tipo === 'CEDULA')    inp.placeholder = 'Ej: 1723456789 (10 dígitos)';
        else if (tipo === 'RUC')  inp.placeholder = 'Ej: 1723456789001 (13 dígitos)';
        else                       inp.placeholder = 'Ej: A1234567 (5-20 chars)';
        validarIdentificacion();
    }

    function validarIdentificacion() {
        if (esEdicion) return true; // bloqueado en edición
        const tipo = document.getElementById('tipoIdentificacion').value;
        const val  = document.getElementById('identificacion').value.trim();
        if (!val) { mostrarError('err-identificacion', ''); return true; }

        if (tipo === 'CEDULA') {
            if (!/^\d{10}$/.test(val)) { mostrarError('err-identificacion','La cédula debe tener exactamente 10 dígitos'); return false; }
        } else if (tipo === 'RUC') {
            if (!/^\d{13}$/.test(val)) { mostrarError('err-identificacion','El RUC debe tener exactamente 13 dígitos'); return false; }
        } else {
            if (!/^[A-Za-z0-9]{5,20}$/.test(val)) { mostrarError('err-identificacion','Pasaporte: 5 a 20 caracteres alfanuméricos'); return false; }
        }
        mostrarError('err-identificacion', '');
        return true;
    }

    function validarTexto(el, errId, label) {
        const val = el.value.trim();
        if (!val) { mostrarError(errId, `${label} es obligatorio`); return false; }
        mostrarError(errId, '');
        return true;
    }

    function validarCorreo() {
        const val = document.getElementById('correo').value.trim();
        if (!val) { mostrarError('err-correo', 'El correo electrónico es obligatorio'); return false; }
        const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        mostrarError('err-correo', ok ? '' : 'Formato de correo inválido (ej: usuario@dominio.com)');
        return ok;
    }

    function validarTelefono() {
        const val = document.getElementById('telefono').value.trim();
        if (!val) { mostrarError('err-telefono',''); return true; }
        const ok = /^[+]?\d{7,15}$/.test(val);
        mostrarError('err-telefono', ok ? '' : 'Teléfono: 7-15 dígitos (puede iniciar con +)');
        return ok;
    }

    function validarFormulario() {
        const idOk   = validarIdentificacion();
        const nomOk  = validarTexto(document.getElementById('nombres'),'err-nombres','Nombres');
        const corrOk = validarCorreo();
        const telOk  = validarTelefono();
        return idOk && nomOk && corrOk && telOk;
    }

    // ── Modal ──────────────────────────────────────────────────────
    function limpiarFormulario() {
        esEdicion = false;
        tipoOriginal = '';
        identificacionOriginal = '';

        ['clienteId','identificacion','nombres','apellidos','correo','telefono','direccion'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = '';
        });
        document.getElementById('tipoIdentificacion').value = 'CEDULA';
        document.getElementById('tipoIdentificacion').disabled = false;

        const inp = document.getElementById('identificacion');
        inp.readOnly = false;
        inp.classList.remove('field-locked','error','ok');
        inp.placeholder = 'Ej: 1723456789 (10 dígitos)';
        document.getElementById('ruc-hint').classList.remove('visible');

        ['err-identificacion','err-nombres','err-correo','err-telefono'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.textContent=''; el.classList.remove('visible'); }
        });
        ['nombres','apellidos','correo','telefono','direccion'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('error','ok');
        });
    }

    function abrirModalNuevo() {
        limpiarFormulario();
        document.getElementById('modalTitulo').textContent = 'Nuevo Cliente';
        document.getElementById('modalOverlay').classList.add('open');
    }

    function cerrarModal() {
        document.getElementById('modalOverlay').classList.remove('open');
    }

    async function editarCliente(id) {
        const h   = authHeaders();
        const res = await fetch(`/api/clientes/${id}`, {headers: h});
        const data = await res.json();
        const c   = data.datos ?? data;

        limpiarFormulario();
        esEdicion = true;
        tipoOriginal = c.tipoIdentificacion ?? 'CEDULA';
        identificacionOriginal = c.identificacion ?? '';

        document.getElementById('modalTitulo').textContent = 'Editar Cliente';
        document.getElementById('clienteId').value  = c.idCliente;
        document.getElementById('nombres').value     = c.nombres ?? '';
        document.getElementById('apellidos').value   = c.apellidos ?? '';
        document.getElementById('correo').value      = c.correo ?? '';
        document.getElementById('telefono').value    = c.telefono ?? '';
        document.getElementById('direccion').value   = c.direccion ?? '';

        // Configurar select de tipo
        const tipoSel = document.getElementById('tipoIdentificacion');
        if (tipoOriginal === 'CEDULA') {
            // CEDULA puede convertirse a RUC (agrega 001)
            tipoSel.innerHTML = `
                <option value="CEDULA">Cédula (10 dígitos)</option>
                <option value="RUC">RUC (13 dígitos)</option>
            `;
            tipoSel.value    = 'CEDULA';
            tipoSel.disabled = false;
        } else if (tipoOriginal === 'RUC' && identificacionOriginal.endsWith('001')) {
            // RUC derivado de cédula: permite volver a CEDULA (quita los últimos 3)
            tipoSel.innerHTML = `
                <option value="RUC">RUC (13 dígitos)</option>
                <option value="CEDULA">Cédula (10 dígitos)</option>
            `;
            tipoSel.value    = 'RUC';
            tipoSel.disabled = false;
        } else {
            // PASAPORTE u otro RUC: bloquear tipo
            tipoSel.innerHTML = `<option value="${tipoOriginal}">${tipoOriginal}</option>`;
            tipoSel.disabled  = true;
        }

        // Campo identificación: siempre bloqueado en edición
        const inp = document.getElementById('identificacion');
        inp.value    = identificacionOriginal;
        inp.readOnly = true;
        inp.classList.add('field-locked');

        document.getElementById('ruc-hint').classList.remove('visible');
        document.getElementById('modalOverlay').classList.add('open');
    }

    function solicitarGuardarCliente() {
        if (!validarFormulario()) return;
        const id     = document.getElementById('clienteId').value;
        const nombre = (document.getElementById('nombres').value.trim() + ' ' + (document.getElementById('apellidos').value.trim())).trim();
        const msg    = id ? `¿Actualizar los datos de ${nombre}?` : `¿Guardar el nuevo cliente ${nombre}?`;
        confirmar(msg, guardarCliente);
    }

    async function guardarCliente() {
        if (!validarFormulario()) return;

        const h  = authHeaders();
        const id = document.getElementById('clienteId').value;
        const body = {
            tipoIdentificacion: document.getElementById('tipoIdentificacion').value,
            identificacion:     document.getElementById('identificacion').value.trim(),
            nombres:    document.getElementById('nombres').value.trim(),
            apellidos:  document.getElementById('apellidos').value.trim() || null,
            correo:     document.getElementById('correo').value.trim() || null,
            telefono:   document.getElementById('telefono').value.trim() || null,
            direccion:  document.getElementById('direccion').value.trim() || null
        };

        const url    = id ? `/api/clientes/${id}` : '/api/clientes';
        const method = id ? 'PUT' : 'POST';

        const btn = document.getElementById('btnGuardar');
        btn.disabled = true; btn.textContent = 'Guardando...';

        try {
            const res = await fetch(url, {method, headers: h, body: JSON.stringify(body)});
            if (res.ok) {
                cerrarModal();
                cargarDatos();
                mostrarAlerta(id ? 'Cliente actualizado correctamente' : 'Cliente creado correctamente', 'success');
            } else {
                const err = await res.json();
                const msg = err.mensaje ?? err.message ?? 'Error al guardar el cliente';
                // Resaltar campo identificación si el error es de duplicado
                if (msg.toLowerCase().includes('identif') || msg.toLowerCase().includes('existe') || msg.toLowerCase().includes('duplicad')) {
                    mostrarError('err-identificacion', msg);
                }
                mostrarAlerta(msg, 'error');
            }
        } catch(e) { mostrarAlerta('Error de conexión con el servidor', 'error'); }
        finally { btn.disabled = false; btn.textContent = 'Guardar Cliente'; }
    }

    function solicitarCambioEstado(id, activo) {
        const msg = activo ? '¿Desea activar este cliente?' : '¿Desea desactivar este cliente?';
        confirmar(msg, () => cambiarEstado(id, activo));
    }

    async function cambiarEstado(id, activo) {
        const h = authHeaders();
        try {
            const res = await fetch(`/api/clientes/${id}/estado?activo=${activo}`, {method:'PATCH', headers:h});
            if (res.ok) {
                cargarDatos();
                mostrarAlerta(activo ? 'Cliente activado' : 'Cliente desactivado', 'success');
            } else {
                mostrarAlerta('Error al cambiar el estado', 'error');
            }
        } catch(e) { mostrarAlerta('Error de conexión', 'error'); }
    }

    cargarDatos();
    document.getElementById('buscador').addEventListener('input', function() {
        document.getElementById('buscadorClear').style.display = this.value ? 'block' : 'none';
    });
</script>
</body>
</html>
