<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Inventario')}"></head>
<style>
    .field-error { color:#dc2626;font-size:11px;margin-top:4px;display:none;font-weight:500; }
    .field-error.visible { display:block; }
    .form-group input.error, .form-group select.error { border-color:#dc2626!important;background:#fff5f5; }
    .form-group input.ok { border-color:#059669!important; }
    .modal-xl { max-width:820px!important; }
    .modal-section { background:#f8fafc;border-radius:8px;padding:16px;margin-bottom:14px; }
    .modal-section-title {
        font-size:11px;font-weight:700;color:#4C97D2;
        text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;
    }
    .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
    .grid-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px; }
    .form-group { margin-bottom:0; }
    .form-group label {
        display:block;font-size:11px;font-weight:700;color:#12274B;
        margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;
    }
    .form-group input, .form-group select {
        width:100%;padding:9px 12px;border:1.5px solid #D0EDFC;
        border-radius:7px;font-size:13px;outline:none;color:#12274B;
        transition:border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color:#1468B1; }
    /* Stock table inside modal */
    .stock-table { width:100%;border-collapse:collapse;font-size:13px; }
    .stock-table th {
        background:#eef4fb;color:#12274B;font-size:11px;text-transform:uppercase;
        letter-spacing:0.5px;padding:10px 12px;font-weight:700;text-align:left;
    }
    .stock-table td { padding:10px 12px;border-top:1px solid #f0f4f8;vertical-align:middle; }
    .stock-input { width:90px;padding:6px 10px;border:1.5px solid #D0EDFC;border-radius:6px;font-size:13px;outline:none;color:#12274B; }
    .stock-input:focus { border-color:#1468B1; }
    .estado-badge-ok { background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700; }
    .estado-badge-sin { background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700; }
</style>
<body>
<div th:replace="~{layout :: sidebar('productos')}"></div>

<div class="main">
    <div class="topbar">
        <h1>Inventario</h1>
        <span class="user-badge" id="userDisplay"></span>
    </div>

    <div class="card-box">
        <div class="card-box-header">
            <h2>Listado de Productos</h2>
            <button class="btn btn-primary" id="btnNuevo" onclick="abrirModalNuevo()">+ Nuevo Producto</button>
        </div>

        <div style="display:flex;gap:12px;padding:16px 24px;border-bottom:1px solid #f0f4f8;flex-wrap:wrap;">
            <input type="text" id="buscador" placeholder="Buscar por nombre o código..."
                   oninput="resetPagina()"
                   style="flex:1;min-width:200px;padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B"/>
            <select id="filtroCat" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B;min-width:160px">
                <option value="">Todas las categorías</option>
            </select>
            <select id="filtroSize" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B">
                <option value="10">10 por página</option>
                <option value="25">25 por página</option>
                <option value="50">50 por página</option>
            </select>
        </div>

        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Unidad</th>
                <th>Precio Venta</th>
                <th>IVA</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaProductos">
            <tr><td colspan="8" style="text-align:center;color:#aaa;padding:30px">Cargando...</td></tr>
            </tbody>
        </table>

        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid #f0f4f8;">
            <span id="infoPagina" style="font-size:13px;color:#888"></span>
            <div style="display:flex;gap:6px;" id="controlesPagina"></div>
        </div>
    </div>
</div>

<!-- Modal Producto + Inventario -->
<div class="modal-overlay" id="modalOverlay" style="overflow-y:auto;padding:24px;align-items:flex-start;">
    <div class="modal modal-xl">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <h3 id="modalTitulo" style="margin:0;font-size:17px;color:#12274B;">Nuevo Producto</h3>
            <button onclick="cerrarModal()" style="background:none;border:none;cursor:pointer;font-size:22px;color:#888;line-height:1;">×</button>
        </div>
        <input type="hidden" id="productoId"/>

        <!-- Sección: Datos del Producto -->
        <div class="modal-section">
            <div class="modal-section-title">Información del Producto</div>
            <div class="grid-3" style="margin-bottom:14px;">
                <div class="form-group">
                    <label>Código <span style="color:#dc2626">*</span></label>
                    <input type="text" id="codigo" placeholder="PROD-001"
                           oninput="autoMayus(this);validarCodigo()" onblur="validarCodigo()" maxlength="20"
                           style="text-transform:uppercase"/>
                    <span class="field-error" id="err-codigo"></span>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria"></select>
                </div>
                <div class="form-group">
                    <label>Unidad de Medida <span style="color:#dc2626">*</span></label>
                    <select id="unidadMedida">
                        <option value="UNIDAD">Unidad</option>
                        <option value="KG">Kilogramo (KG)</option>
                        <option value="LB">Libra (LB)</option>
                        <option value="LT">Litro (LT)</option>
                        <option value="ML">Mililitro (ML)</option>
                        <option value="M">Metro (M)</option>
                        <option value="CM">Centímetro (CM)</option>
                        <option value="M2">Metro cuadrado (M²)</option>
                        <option value="CAJA">Caja</option>
                        <option value="PAQUETE">Paquete</option>
                        <option value="DOCENA">Docena</option>
                        <option value="PAR">Par</option>
                        <option value="SET">Set</option>
                        <option value="ROLLO">Rollo</option>
                        <option value="SERVICIO">Servicio</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-bottom:14px;">
                <label>Nombre del Producto <span style="color:#dc2626">*</span></label>
                <input type="text" id="nombre" placeholder="EJ: ARROZ SUPERIOR 1KG"
                       oninput="autoMayus(this);validarNombre()" onblur="validarNombre()" maxlength="80"
                       style="text-transform:uppercase"/>
                <span class="field-error" id="err-nombre"></span>
            </div>
            <div class="form-group" style="margin-bottom:14px;">
                <label>Descripción</label>
                <input type="text" id="descripcion" placeholder="DESCRIPCIÓN OPCIONAL" maxlength="200"
                       oninput="autoMayus(this)" style="text-transform:uppercase"/>
            </div>
            <div class="grid-3">
                <div class="form-group">
                    <label>Precio de Venta (USD) <span style="color:#dc2626">*</span></label>
                    <input type="number" id="precioVenta" placeholder="0.00" step="0.01" min="0.01"
                           oninput="validarPrecio()" onblur="validarPrecio()"/>
                    <span class="field-error" id="err-precio"></span>
                </div>
                <div class="form-group">
                    <label>Aplica IVA</label>
                    <select id="aplicaIva">
                        <option value="true">Sí — Grava IVA</option>
                        <option value="false">No — 0%</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo SRI</label>
                    <select id="tipoSri">
                        <option value="BIEN">Bien</option>
                        <option value="SERVICIO">Servicio</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Sección: Stock por Sucursal (solo en edición) -->
        <div id="seccionStock" class="modal-section" style="display:none;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <div class="modal-section-title" style="margin:0;">Stock por Sucursal</div>
                <span style="font-size:11px;color:#888;">Edita la cantidad y presiona Guardar en cada fila</span>
            </div>
            <table class="stock-table">
                <thead>
                <tr>
                    <th>Sucursal</th>
                    <th>Estado</th>
                    <th style="width:130px">Cantidad</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="stockBody">
                <tr><td colspan="4" style="text-align:center;color:#aaa;padding:16px">Cargando stock...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="modal-footer" style="margin-top:8px;">
            <button class="btn" onclick="cerrarModal()" style="background:#f0f4f8;color:#333">Cancelar</button>
            <button class="btn btn-primary" id="btnGuardarProducto" onclick="guardarProducto()">Guardar Producto</button>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
    if (rol === 'CAJERO') window.location.href = '/ventas';

    let paginaActual = 0;
    let totalPaginas = 0;
    let sucursales = [];

    function resetPagina() { paginaActual = 0; cargarDatos(); }

    async function cargarDatos() {
        const h = authHeaders();
        const search = document.getElementById('buscador').value;
        const idCategoria = document.getElementById('filtroCat').value;
        const size = document.getElementById('filtroSize').value;

        let url = `/api/productos/paginado?page=${paginaActual}&size=${size}`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (idCategoria) url += `&idCategoria=${idCategoria}`;

        try {
            const res = await fetch(url, {headers: h});
            const data = await res.json();
            const page = data.datos ?? data;
            totalPaginas = page.totalPaginas;

            document.getElementById('infoPagina').textContent =
                `Mostrando ${page.contenido.length} de ${page.totalElementos} productos — Página ${page.paginaActual + 1} de ${page.totalPaginas || 1}`;

            if (!page.contenido.length) {
                document.getElementById('tablaProductos').innerHTML =
                    '<tr><td colspan="8" style="text-align:center;color:#aaa;padding:30px">No se encontraron productos</td></tr>';
                document.getElementById('controlesPagina').innerHTML = '';
                return;
            }

            document.getElementById('tablaProductos').innerHTML = page.contenido.map(p => `
                <tr>
                    <td><code style="background:#f0f4f8;padding:2px 6px;border-radius:4px;font-size:12px">${p.codigo}</code></td>
                    <td><strong>${p.nombre}</strong><br/><span style="font-size:11px;color:#888">${p.descripcion ?? ''}</span></td>
                    <td>${p.categoria ?? '-'}</td>
                    <td><span style="font-size:12px;color:#4C97D2">${p.unidadMedida ?? '-'}</span></td>
                    <td><strong>$${parseFloat(p.precioVenta).toFixed(2)}</strong></td>
                    <td><span class="badge ${p.aplicaIva ? 'badge-success' : 'badge-danger'}">${p.aplicaIva ? 'Sí' : 'No'}</span></td>
                    <td><span class="badge ${p.activo ? 'badge-success' : 'badge-danger'}">${p.activo ? 'Activo' : 'Inactivo'}</span></td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="editarProducto(${p.idProducto})">Editar / Stock</button>
                    </td>
                </tr>
            `).join('');

            renderPaginacion();
        } catch(e) { console.error(e); }
    }

    function renderPaginacion() {
        const cont = document.getElementById('controlesPagina');
        let html = `<button class="btn btn-sm" onclick="irPagina(${paginaActual - 1})"
            ${paginaActual === 0 ? 'disabled style="opacity:0.4"' : ''}
            style="background:#f0f4f8;color:#333">Anterior</button>`;
        for (let i = 0; i < totalPaginas; i++) {
            if (totalPaginas <= 7 || Math.abs(i - paginaActual) <= 2)
                html += `<button class="btn btn-sm" onclick="irPagina(${i})"
                    style="background:${i === paginaActual ? '#1468B1' : '#f0f4f8'};color:${i === paginaActual ? 'white' : '#333'}">${i + 1}</button>`;
        }
        html += `<button class="btn btn-sm" onclick="irPagina(${paginaActual + 1})"
            ${paginaActual >= totalPaginas - 1 ? 'disabled style="opacity:0.4"' : ''}
            style="background:#f0f4f8;color:#333">Siguiente</button>`;
        cont.innerHTML = html;
    }

    function irPagina(p) { if (p >= 0 && p < totalPaginas) { paginaActual = p; cargarDatos(); } }

    async function cargarCategorias() {
        const h = authHeaders();
        const res = await fetch('/api/categorias', {headers: h});
        const data = await res.json();
        const cats = data.datos ?? data;
        const opts = cats.map(c => `<option value="${c.idCategoria}">${c.nombre}</option>`).join('');
        document.getElementById('filtroCat').innerHTML = '<option value="">Todas las categorías</option>' + opts;
        document.getElementById('categoria').innerHTML = '<option value="">Sin categoría</option>' + opts;
    }

    async function cargarSucursales() {
        const h = authHeaders();
        const res = await fetch('/api/sucursales', {headers: h});
        const data = await res.json();
        sucursales = data.datos ?? data;
    }

    /* ── Utilidades ─────────────────────────────────── */
    function autoMayus(el) {
        const pos = el.selectionStart;
        el.value = el.value.toUpperCase();
        try { el.setSelectionRange(pos, pos); } catch(e){}
    }

    /* ── Validaciones ─────────────────────────────────── */
    function mostrarError(id, msg) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = msg;
        el.classList.toggle('visible', !!msg);
        const input = el.previousElementSibling;
        if (input && (input.tagName==='INPUT'||input.tagName==='SELECT')) {
            input.classList.toggle('error', !!msg);
            input.classList.toggle('ok', !msg && String(input.value).trim() !== '');
        }
    }

    function validarCodigo() {
        const val = document.getElementById('codigo').value.trim();
        if (!val) { mostrarError('err-codigo','Código es obligatorio'); return false; }
        if (val.length > 20) { mostrarError('err-codigo','Máximo 20 caracteres'); return false; }
        mostrarError('err-codigo','');
        return true;
    }

    function validarNombre() {
        const val = document.getElementById('nombre').value.trim();
        if (!val) { mostrarError('err-nombre','Nombre es obligatorio'); return false; }
        if (val.length > 80) { mostrarError('err-nombre','Máximo 80 caracteres'); return false; }
        mostrarError('err-nombre','');
        return true;
    }

    function validarPrecio() {
        const val = parseFloat(document.getElementById('precioVenta').value);
        if (isNaN(val) || val <= 0) { mostrarError('err-precio','El precio debe ser mayor a 0'); return false; }
        mostrarError('err-precio','');
        return true;
    }

    function validarFormulario() {
        return validarCodigo() & validarNombre() & validarPrecio();
    }

    /* ── Modal ────────────────────────────────────────── */
    function limpiarFormulario() {
        ['productoId','codigo','nombre','descripcion','precioVenta'].forEach(id => {
            const el = document.getElementById(id); if(el) el.value='';
        });
        document.getElementById('unidadMedida').value = 'UNIDAD';
        document.getElementById('aplicaIva').value = 'true';
        document.getElementById('tipoSri').value = 'BIEN';
        document.getElementById('categoria').value = '';
        ['err-codigo','err-nombre','err-precio'].forEach(id => {
            const el = document.getElementById(id);
            if(el){ el.textContent=''; el.classList.remove('visible'); }
        });
        ['codigo','nombre','precioVenta'].forEach(id=>{
            const el=document.getElementById(id);
            if(el) el.classList.remove('error','ok');
        });
        document.getElementById('seccionStock').style.display = 'none';
        document.getElementById('stockBody').innerHTML = '';
    }

    function abrirModalNuevo() {
        limpiarFormulario();
        document.getElementById('modalTitulo').textContent = 'Nuevo Producto';
        document.getElementById('modalOverlay').classList.add('open');
    }

    function cerrarModal() {
        document.getElementById('modalOverlay').classList.remove('open');
    }

    async function editarProducto(id) {
        const h = authHeaders();
        const res = await fetch(`/api/productos/${id}`, {headers: h});
        const data = await res.json();
        const p = data.datos ?? data;

        limpiarFormulario();
        document.getElementById('modalTitulo').textContent = 'Editar Producto';
        document.getElementById('productoId').value = p.idProducto;
        document.getElementById('codigo').value = p.codigo;
        document.getElementById('nombre').value = p.nombre;
        document.getElementById('descripcion').value = p.descripcion ?? '';
        document.getElementById('precioVenta').value = p.precioVenta;
        document.getElementById('unidadMedida').value = p.unidadMedida ?? 'UNIDAD';
        document.getElementById('aplicaIva').value = String(p.aplicaIva);
        document.getElementById('tipoSri').value = p.tipoSri ?? 'BIEN';

        // Categoría
        const cats = document.getElementById('categoria').options;
        for (let i = 0; i < cats.length; i++) {
            if (cats[i].text === p.categoria) { document.getElementById('categoria').selectedIndex = i; break; }
        }

        // Mostrar stock
        document.getElementById('seccionStock').style.display = 'block';
        await cargarStockProducto(p.idProducto);

        document.getElementById('modalOverlay').classList.add('open');
    }

    async function cargarStockProducto(idProducto) {
        const h = authHeaders();
        const body = document.getElementById('stockBody');
        body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#aaa;padding:12px">Cargando...</td></tr>';

        try {
            const res = await fetch(`/api/stock/producto/${idProducto}`, {headers: h});
            const data = await res.json();
            const stocks = data.datos ?? data;

            // Crear map: idSucursal → registro inventario
            const stockMap = {};
            stocks.forEach(s => {
                // Buscar idSucursal según nombre
                const suc = sucursales.find(x => x.nombre === s.sucursal);
                if (suc) stockMap[suc.idSucursal] = s;
            });

            if (!sucursales.length) {
                body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#aaa;">Sin sucursales</td></tr>';
                return;
            }

            body.innerHTML = sucursales.map(suc => {
                const inv = stockMap[suc.idSucursal];
                const cantidad = inv ? inv.cantidad : 0;
                const estado = inv ? inv.estadoStock : 'SIN STOCK';
                const idInv = inv ? inv.idInventario : '';
                return `
                <tr>
                    <td><strong>${suc.nombre}</strong><br/><span style="font-size:11px;color:#888">${suc.ciudad}</span></td>
                    <td><span class="${estado === 'OK' ? 'estado-badge-ok' : 'estado-badge-sin'}">${estado}</span></td>
                    <td>
                        <input type="number" class="stock-input" id="stock-${suc.idSucursal}"
                               value="${cantidad}" min="0"
                               onkeyup="if(event.key==='Enter')guardarStock(${idProducto},${suc.idSucursal},'${idInv}')"/>
                    </td>
                    <td>
                        <button class="btn btn-primary btn-sm"
                            onclick="guardarStock(${idProducto}, ${suc.idSucursal}, '${idInv}')">
                            Guardar
                        </button>
                    </td>
                </tr>`;
            }).join('');
        } catch(e) {
            body.innerHTML = '<tr><td colspan="4" style="color:#dc2626;text-align:center;padding:12px">Error al cargar stock</td></tr>';
        }
    }

    async function guardarStock(idProducto, idSucursal, idInventario) {
        const h = authHeaders();
        const cantidadEl = document.getElementById(`stock-${idSucursal}`);
        const cantidad = parseInt(cantidadEl.value);
        if (isNaN(cantidad) || cantidad < 0) { alert('Cantidad inválida'); return; }

        const body = { idProducto, idSucursal, cantidad };
        try {
            const res = await fetch('/api/inventario', {method: 'POST', headers: h, body: JSON.stringify(body)});
            if (res.ok) {
                await cargarStockProducto(idProducto);
            } else {
                const err = await res.json();
                alert(err.mensaje ?? 'Error al guardar stock');
            }
        } catch(e) { alert('Error de conexión'); }
    }

    async function guardarProducto() {
        if (!validarFormulario()) return;

        const h = authHeaders();
        const id = document.getElementById('productoId').value;
        const catVal = document.getElementById('categoria').value;
        const body = {
            codigo: document.getElementById('codigo').value.trim(),
            nombre: document.getElementById('nombre').value.trim(),
            idCategoria: catVal ? parseInt(catVal) : null,
            precioVenta: parseFloat(document.getElementById('precioVenta').value),
            descripcion: document.getElementById('descripcion').value.trim() || null,
            unidadMedida: document.getElementById('unidadMedida').value,
            aplicaIva: document.getElementById('aplicaIva').value === 'true',
            tipoSri: document.getElementById('tipoSri').value
        };

        const url = id ? `/api/productos/${id}` : '/api/productos';
        const method = id ? 'PUT' : 'POST';
        const btn = document.getElementById('btnGuardarProducto');
        btn.disabled = true;
        btn.textContent = 'Guardando...';

        try {
            const res = await fetch(url, {method, headers: h, body: JSON.stringify(body)});
            if (res.ok) {
                if (!id) {
                    // Nuevo producto: mostrar sección de stock
                    const data = await res.json();
                    const nuevo = data.datos ?? data;
                    document.getElementById('productoId').value = nuevo.idProducto;
                    document.getElementById('modalTitulo').textContent = 'Editar Producto';
                    document.getElementById('seccionStock').style.display = 'block';
                    await cargarStockProducto(nuevo.idProducto);
                    cargarDatos();
                } else {
                    cerrarModal();
                    cargarDatos();
                }
            } else {
                const err = await res.json();
                alert(err.mensaje ?? 'Error al guardar');
            }
        } catch(e) { alert('Error de conexión'); }
        finally {
            btn.disabled = false;
            btn.textContent = 'Guardar Producto';
        }
    }

    async function inicializar() {
        await Promise.all([cargarCategorias(), cargarSucursales()]);
        cargarDatos();
    }

    inicializar();
</script>
</body>
</html>
