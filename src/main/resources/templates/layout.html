<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Sistema de Facturación'">Sistema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
        .sidebar {
            width: 240px; background: #12274B; height: 100vh;
            position: fixed; left: 0; top: 0;
            display: flex; flex-direction: column;
        }
        .sidebar-logo {
            color: white; text-align: center; padding: 24px 20px;
            border-bottom: 1px solid #1a3a6b;
        }
        .sidebar-logo h2 { font-size: 15px; font-weight: 700; }
        .sidebar-logo p { font-size: 11px; color: #4C97D2; margin-top: 4px; }
        .nav-menu { flex: 1; padding: 10px 0; overflow-y: auto; }
        .nav-item {
            display: flex; align-items: center; color: #90afd4;
            text-decoration: none; padding: 11px 24px; font-size: 13.5px;
            transition: all 0.2s; gap: 10px;
        }
        .nav-item:hover { background: #1468B1; color: white; }
        .nav-item.active { background: #1468B1; color: white; border-right: 3px solid #D0EDFC; }
        .nav-section {
            color: #4C97D2; font-size: 10px; padding: 14px 24px 4px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .sidebar-footer { padding: 16px; border-top: 1px solid #1a3a6b; }
        .sidebar-user { color: #4C97D2; font-size: 12px; text-align: center; margin-bottom: 10px; }
        .btn-logout {
            width: 100%; background: #2A7ABF; color: white; border: none;
            padding: 9px; border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .btn-logout:hover { background: #c0392b; }
        .main { margin-left: 240px; padding: 28px; }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .topbar h1 { font-size: 20px; color: #12274B; font-weight: 700; display:flex; align-items:center; gap:6px; }
        .user-badge {
            background: #D0EDFC; color: #12274B; padding: 6px 14px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
        }
        /* Tabla */
        .card-box {
            background: white; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(18,39,75,0.08); overflow: hidden;
            border-top: 4px solid #1468B1;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(18,39,75,0.15);
        }
        .card-box-header {
            padding: 18px 24px; border-bottom: 1px solid #f0f4f8;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-box-header h2 { font-size: 15px; color: #12274B; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8fafc; color: #12274B; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 12px 16px; text-align: left; font-weight: 600;
        }
        td { padding: 12px 16px; font-size: 13.5px; color: #333; border-top: 1px solid #f0f4f8; }
        tr:hover td { background: #f8fafc; }
        /* Botones */
        .btn {
            padding: 8px 16px; border-radius: 7px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-primary { background: #1468B1; color: white; }
        .btn-primary:hover { background: #12274B; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover { background: #dc2626; color: white; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: white; border-radius: 12px; padding: 28px;
            width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h3 { font-size: 16px; color: #12274B; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: #12274B; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1.5px solid #D0EDFC;
            border-radius: 7px; font-size: 13.5px; outline: none; color: #12274B;
        }
        .form-group input:focus, .form-group select:focus { border-color: #1468B1; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .badge {
            padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        /* Bootstrap Icons alignment */
        .btn i.bi { line-height: 1; font-size: 13px; }
        .topbar h1 i.bi { font-size: 18px; line-height: 1; }
        .btn-sm i.bi { font-size: 12px; }
        .btn-logout i.bi { vertical-align: -1px; margin-right: 5px; }
        .nav-item i.bi { font-size: 15px; min-width: 20px; text-align: center; flex-shrink: 0; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<div th:fragment="sidebar(active)">
    <div class="sidebar">
        <div class="sidebar-logo">
            <div style="font-size:28px;margin-bottom:6px;"><i class="bi bi-receipt-cutoff" style="color:#4C97D2"></i></div>
            <h2>Sistema de Facturación</h2>
            <p>Quito · Ambato · Cuenca</p>
        </div>
        <div class="nav-menu" id="navMenu"></div>
        <div class="sidebar-footer">
            <div class="sidebar-user" id="sidebarUser"></div>
            <button class="btn-logout" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
        </div>
    </div>
    <script th:inline="javascript">
        const _active = [[${active}]];
    </script>
</div>

<div th:fragment="scripts">
    <script>
        /* ── Utilidad: decodifica el payload del JWT (base64url) y revisa exp ── */
        function jwtExpirado(t) {
            try {
                const payload = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
                return payload.exp * 1000 < Date.now();
            } catch(e) { return true; }
        }

        const token    = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        const rol      = localStorage.getItem('rol');

        /* ── Guardia de sesión: sin token o token expirado → login ── */
        if (!token || jwtExpirado(token)) {
            localStorage.clear();
            window.location.href = '/login';
        }

        /* ── Interceptor global de fetch: 401 → sesión expirada → login ── */
        (function() {
            const _fetch = window.fetch;
            window.fetch = async function(...args) {
                const url = typeof args[0] === 'string' ? args[0] : (args[0]?.url || '');
                const res = await _fetch.apply(this, args);
                if (res.status === 401 && url.startsWith('/api/')) {
                    localStorage.clear();
                    window.location.href = '/login';
                }
                return res;
            };
        })();

        const menuAdmin = `
        <div class="nav-section">Principal</div>
        <a href="/dashboard" class="nav-item ${_active==='dashboard'?'active':''}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/usuarios" class="nav-item ${_active==='usuarios'?'active':''}"><i class="bi bi-people-fill"></i> Usuarios</a>
        <div class="nav-section">Gestión</div>
        <a href="/productos" class="nav-item ${_active==='productos'||_active==='inventario'?'active':''}"><i class="bi bi-box-seam-fill"></i> Inventario</a>
        <a href="/clientes" class="nav-item ${_active==='clientes'?'active':''}"><i class="bi bi-person-lines-fill"></i> Clientes</a>
        <div class="nav-section">Operaciones</div>
        <a href="/ventas" class="nav-item ${_active==='ventas'?'active':''}"><i class="bi bi-file-earmark-plus-fill"></i> Facturar</a>
        <a href="/facturas" class="nav-item ${_active==='facturas'?'active':''}"><i class="bi bi-receipt"></i> Facturas</a>
    `;
        const menuVendedor = `
        <div class="nav-section">Gestión</div>
        <a href="/clientes" class="nav-item ${_active==='clientes'?'active':''}"><i class="bi bi-person-lines-fill"></i> Clientes</a>
        <div class="nav-section">Operaciones</div>
        <a href="/ventas" class="nav-item ${_active==='ventas'?'active':''}"><i class="bi bi-file-earmark-plus-fill"></i> Facturar</a>
        <a href="/facturas" class="nav-item ${_active==='facturas'?'active':''}"><i class="bi bi-receipt"></i> Facturas</a>
    `;
        const menuBodeguero = `
        <div class="nav-section">Bodega</div>
        <a href="/productos" class="nav-item ${_active==='productos'||_active==='inventario'?'active':''}"><i class="bi bi-box-seam-fill"></i> Inventario</a>
    `;

        const rolDisplay = { ADMIN: 'Administrador', CAJERO: 'Vendedor', BODEGUERO: 'Bodeguero' };
        const menus = { ADMIN: menuAdmin, CAJERO: menuVendedor, BODEGUERO: menuBodeguero };
        if (document.getElementById('navMenu'))
            document.getElementById('navMenu').innerHTML = menus[rol] || menuVendedor;
        const _layoutSucursal = localStorage.getItem('sucursal') || '';
        if (document.getElementById('sidebarUser')) {
            const su = document.getElementById('sidebarUser');
            su.innerHTML = username + ' &middot; ' + (rolDisplay[rol]||rol) +
                (_layoutSucursal && rol !== 'ADMIN' ? '<br><span style="color:#90afd4;font-size:11px">' + _layoutSucursal + '</span>' : '');
        }
        if (document.getElementById('userDisplay'))
            document.getElementById('userDisplay').textContent = username + ' — ' + (rolDisplay[rol]||rol) +
                (_layoutSucursal && rol !== 'ADMIN' ? ' · ' + _layoutSucursal : '');

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        }
    </script>
</div>
</html>
