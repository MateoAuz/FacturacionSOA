<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Factura')}"></head>
<style>
    /* ── Layout ── */
    .detalle-grid {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 20px;
        align-items: start;
    }
    .d-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(18,39,75,.08);
        border-top: 4px solid #1468B1;
        overflow: hidden;
    }
    .d-head {
        padding: 13px 20px;
        border-bottom: 1px solid #f0f4f8;
        font-size: 11px;
        font-weight: 700;
        color: #12274B;
        text-transform: uppercase;
        letter-spacing: .5px;
    }
    .d-body { padding: 18px 20px; }

    /* ── Cabecera factura ── */
    .fac-header {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(18,39,75,.08);
        border-top: 4px solid #1468B1;
        padding: 20px 24px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 16px;
    }
    .fac-num  { font-size: 24px; font-weight: 800; color: #12274B; }
    .fac-sub  { font-size: 12px; color: #888; margin-top: 4px; }

    /* ── Badges estado ── */
    .badge-guardada { background:#fef3c7;color:#92400e;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700; }
    .badge-emitida  { background:#d1fae5;color:#065f46;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700; }
    .badge-anulada  { background:#fee2e2;color:#991b1b;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700; }

    /* ── Info lines ── */
    .info-section-title {
        font-size: 11px; font-weight: 700; color: #4C97D2;
        text-transform: uppercase; letter-spacing: 1px;
        margin-bottom: 12px;
    }
    .info-line { display:flex; gap:8px; font-size:13px; margin-bottom:8px; align-items:baseline; }
    .info-label { color:#888; min-width:120px; flex-shrink:0; }
    .info-val   { color:#12274B; font-weight:600; }

    /* ── Tabla detalles ── */
    .items-table { width:100%;border-collapse:collapse;font-size:13px; }
    .items-table th {
        background:#f8fafc;color:#12274B;font-size:11px;
        text-transform:uppercase;padding:10px 14px;font-weight:700;text-align:left;
    }
    .items-table td { padding:10px 14px;border-top:1px solid #f0f4f8;vertical-align:middle; }
    .items-table tr:hover td { background:#f8fafc; }

    /* ── Totales ── */
    .total-row { display:flex;justify-content:space-between;padding:5px 0;font-size:13px; }
    .total-row.final {
        font-size:18px;font-weight:800;color:#12274B;
        padding-top:10px;margin-top:8px;border-top:2px solid #1468B1;
    }

    /* ── Modales ── */
    .cm-ov {
        display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
        align-items:center;justify-content:center;
    }
    .cm-ov.open { display:flex; }
    #confirmOverlay { z-index:9999; }
    #alertOverlay   { z-index:10000; }
    .cm-bx {
        background:#fff;border-radius:12px;padding:28px 32px;
        max-width:400px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.22);text-align:center;
    }
    .cm-ico  { font-size:38px;margin-bottom:8px; }
    .cm-ttl  { font-size:15px;font-weight:700;color:#12274B;margin-bottom:6px; }
    .cm-sub  { font-size:13px;color:#666;margin-bottom:20px;line-height:1.5; }
    .cm-row  { display:flex;gap:10px;justify-content:center; }
    .spinner { text-align:center;padding:80px;color:#888;font-size:14px; }
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
</style>
<body>
<div th:replace="~{layout :: sidebar('facturas')}"></div>

<!-- Modal: Confirmar -->
<div id="confirmOverlay" class="cm-ov">
    <div class="cm-bx">
        <div id="confirmIcon" class="cm-ico"></div>
        <div id="confirmMsg"  class="cm-ttl"></div>
        <div id="confirmSub"  class="cm-sub"></div>
        <div class="cm-row">
            <button class="btn" id="confirmNo" style="background:#f0f4f8;color:#333;min-width:90px">Cancelar</button>
            <button class="btn btn-primary" id="confirmSi" style="min-width:90px">Confirmar</button>
        </div>
    </div>
</div>

<!-- Modal: Alerta -->
<div id="alertOverlay" class="cm-ov">
    <div class="cm-bx">
        <div id="alertIcon" class="cm-ico"></div>
        <div id="alertMsg"  class="cm-sub" style="margin-bottom:0;font-size:14px;color:#333;"></div>
        <div class="cm-row" style="margin-top:20px;">
            <button class="btn btn-primary" onclick="cerrarAlerta()" style="min-width:90px">Aceptar</button>
        </div>
    </div>
</div>

<div class="main">
    <div class="topbar" style="display:flex;align-items:center;gap:16px;">
        <button onclick="history.back()" class="btn"
                style="background:#f0f4f8;color:#333;padding:8px 14px;font-size:13px;">← Volver</button>
        <h1 style="margin:0;"><i class="bi bi-receipt-cutoff"></i> Detalle de Factura</h1>
        <span class="user-badge" id="userDisplay"></span>
    </div>

    <div id="loadingSpinner" class="spinner"><i class="bi bi-hourglass-split" style="font-size:24px;margin-right:8px"></i> Cargando factura...</div>
    <div id="errorMsg"      style="display:none;color:#dc2626;padding:20px;font-weight:600;font-size:14px;"></div>

    <div id="facturaContent" style="display:none;">

        <!-- Cabecera con número y estado -->
        <div class="fac-header">
            <div>
                <div class="fac-num" id="fNumero">—</div>
                <div class="fac-sub" id="fFechas">—</div>
            </div>
            <div style="text-align:right;">
                <span id="fEstadoBadge" class="badge-guardada">—</span>
                <div id="fEstadoSri" style="font-size:11px;color:#888;margin-top:6px;"></div>
            </div>
        </div>

        <!-- Grid principal -->
        <div class="detalle-grid">

            <!-- IZQUIERDA: info + detalles -->
            <div style="display:flex;flex-direction:column;gap:16px;">

                <!-- Info cliente + emisión -->
                <div class="d-card">
                    <div class="d-head">Información General</div>
                    <div class="d-body" style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
                        <div>
                            <div class="info-section-title">Cliente</div>
                            <div class="info-line"><span class="info-label">Nombre:</span><span class="info-val" id="fCliente">—</span></div>
                            <div class="info-line"><span class="info-label">Identificación:</span><span class="info-val" id="fIdentificacion">—</span></div>
                        </div>
                        <div>
                            <div class="info-section-title">Emisión</div>
                            <div class="info-line"><span class="info-label">Sucursal:</span><span class="info-val" id="fSucursal">—</span></div>
                            <div class="info-line"><span class="info-label">Cajero:</span><span class="info-val" id="fUsuario">—</span></div>
                            <div class="info-line"><span class="info-label">Método pago:</span><span class="info-val" id="fMetodo">—</span></div>
                            <div class="info-line"><span class="info-label">Observación:</span><span class="info-val" id="fObservacion" style="color:#888;font-weight:400;">—</span></div>
                        </div>
                    </div>
                </div>

                <!-- Tabla de productos -->
                <div class="d-card">
                    <div class="d-head">Detalle de Productos</div>
                    <table class="items-table">
                        <thead>
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th style="text-align:right">Precio Unit.</th>
                            <th style="text-align:center">Cantidad</th>
                            <th style="text-align:right">Subtotal</th>
                        </tr>
                        </thead>
                        <tbody id="fDetalles">
                        <tr><td colspan="5" style="text-align:center;color:#aaa;padding:24px">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- DERECHA: totales + acciones -->
            <div style="display:flex;flex-direction:column;gap:16px;position:sticky;top:20px;">

                <!-- Totales -->
                <div class="d-card">
                    <div class="d-head">Resumen</div>
                    <div class="d-body">
                        <div class="total-row"><span style="color:#888">Subtotal</span><span id="fSubtotal">—</span></div>
                        <div class="total-row"><span id="fIvaLabel" style="color:#888">IVA</span><span id="fIva">—</span></div>
                        <div class="total-row final"><span>TOTAL</span><span id="fTotal">—</span></div>
                    </div>
                </div>

                <!-- Acciones -->
                <div class="d-card">
                    <div class="d-head">Acciones</div>
                    <div class="d-body" id="accionesBar" style="display:flex;flex-direction:column;gap:10px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
    if (rol === 'BODEGUERO') window.location.href = '/inventario';

    const idFactura  = parseInt(window.location.pathname.split('/').pop());
    let   facturaData = null;

    const _detIconMap = {
        emit:    '<i class="bi bi-send-fill" style="color:#1468B1;font-size:36px"></i>',
        anular:  '<i class="bi bi-exclamation-triangle-fill" style="color:#d97706;font-size:36px"></i>',
        success: '<i class="bi bi-check-circle-fill" style="color:#059669;font-size:36px"></i>',
        error:   '<i class="bi bi-x-circle-fill" style="color:#dc2626;font-size:36px"></i>',
        warning: '<i class="bi bi-exclamation-triangle-fill" style="color:#d97706;font-size:36px"></i>',
        info:    '<i class="bi bi-info-circle-fill" style="color:#1468B1;font-size:36px"></i>',
    };
    // ── Modales helpers ──────────────────────────────────────────
    function confirmar(iconType, titulo, sub, callbackSi, okLabel, okCss) {
        document.getElementById('confirmIcon').innerHTML = _detIconMap[iconType] || _detIconMap['warning'];
        document.getElementById('confirmMsg').textContent  = titulo;
        document.getElementById('confirmSub').textContent  = sub;
        const okBtn = document.getElementById('confirmSi');
        okBtn.textContent = okLabel || 'Confirmar';
        okBtn.style.cssText = okCss  || '';
        document.getElementById('confirmOverlay').classList.add('open');
        const cerrar = () => document.getElementById('confirmOverlay').classList.remove('open');
        okBtn.onclick = () => { cerrar(); callbackSi(); };
        document.getElementById('confirmNo').onclick = cerrar;
    }

    function mostrarAlerta(msg, tipo) {
        document.getElementById('alertIcon').innerHTML = _detIconMap[tipo] || _detIconMap['info'];
        document.getElementById('alertMsg').textContent  = msg;
        document.getElementById('alertOverlay').classList.add('open');
    }
    function cerrarAlerta() { document.getElementById('alertOverlay').classList.remove('open'); }

    // ── Carga de factura ─────────────────────────────────────────
    async function cargarFactura() {
        const h = authHeaders();
        try {
            const res = await fetch(`/api/facturas/${idFactura}`, {headers: h});
            if (!res.ok) { mostrarError('Factura no encontrada o sin acceso'); return; }
            const data = await res.json();
            facturaData = data.datos ?? data;
            renderFactura();
        } catch(e) {
            mostrarError('Error de conexión al cargar la factura');
        }
    }

    function mostrarError(msg) {
        document.getElementById('loadingSpinner').style.display = 'none';
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    // ── Render ───────────────────────────────────────────────────
    function renderFactura() {
        document.getElementById('loadingSpinner').style.display  = 'none';
        document.getElementById('facturaContent').style.display  = 'block';

        const f = facturaData;

        // Cabecera
        document.getElementById('fNumero').textContent = f.numeroSecuencial ?? '—';

        const fmt = dt => dt
            ? new Date(dt).toLocaleString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
            : null;
        const fechaCreacion = fmt(f.fechaFactura);
        const fechaEmision  = fmt(f.fechaEmision);
        let fechasTxt = fechaCreacion ? `Creada: ${fechaCreacion}` : '';
        if (fechaEmision) fechasTxt += `  •  Emitida: ${fechaEmision}`;
        document.getElementById('fFechas').textContent = fechasTxt || '—';

        // Badge estado
        const badgeMap = { GUARDADA:'badge-guardada', EMITIDA:'badge-emitida', ANULADA:'badge-anulada' };
        const labelMap = { GUARDADA:'Guardada', EMITIDA:'Emitida', ANULADA:'Anulada' };
        const badge = document.getElementById('fEstadoBadge');
        badge.textContent = labelMap[f.estado] ?? f.estado;
        badge.className   = badgeMap[f.estado]  ?? 'badge-guardada';
        document.getElementById('fEstadoSri').textContent = `SRI: ${f.estadoSri ?? '—'}`;

        // Info
        document.getElementById('fCliente').textContent       = f.cliente              ?? '—';
        document.getElementById('fIdentificacion').textContent= f.identificacionCliente ?? '—';
        document.getElementById('fSucursal').textContent      = f.sucursal             ?? '—';
        document.getElementById('fUsuario').textContent       = f.usuario              ?? '—';

        const metodoLabels = { EFECTIVO:'Efectivo', TARJETA:'Tarjeta', TRANSFERENCIA:'Transferencia' };
        document.getElementById('fMetodo').textContent    = metodoLabels[f.metodoPago] ?? f.metodoPago ?? '—';
        document.getElementById('fObservacion').textContent = f.observacion || 'Sin observación';

        // Totales
        document.getElementById('fSubtotal').textContent = f.subtotal  != null ? `$${parseFloat(f.subtotal).toFixed(2)}`  : '—';
        document.getElementById('fIva').textContent      = f.ivaValor  != null ? `$${parseFloat(f.ivaValor).toFixed(2)}`  : '—';
        document.getElementById('fTotal').textContent    = f.total     != null ? `$${parseFloat(f.total).toFixed(2)}`     : '—';

        // Detalles
        const detalles = f.detalles ?? [];
        if (detalles.length) {
            document.getElementById('fDetalles').innerHTML = detalles.map(d => `
                <tr>
                    <td><code style="background:#f0f4f8;padding:2px 6px;border-radius:4px;font-size:11px">${d.codigoProducto ?? '—'}</code></td>
                    <td><strong>${d.producto ?? '—'}</strong></td>
                    <td style="text-align:right">$${parseFloat(d.precioUnitario).toFixed(2)}</td>
                    <td style="text-align:center">${d.cantidad}</td>
                    <td style="text-align:right"><strong>$${parseFloat(d.subtotalLinea).toFixed(2)}</strong></td>
                </tr>
            `).join('');
        } else {
            document.getElementById('fDetalles').innerHTML =
                '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:24px">Sin detalles disponibles</td></tr>';
        }

        renderAcciones();
    }

    // ── Acciones ─────────────────────────────────────────────────
    function renderAcciones() {
        const f   = facturaData;
        const bar = document.getElementById('accionesBar');
        let html  = `<a href="/facturas" class="btn"
                        style="background:#f0f4f8;color:#333;text-align:center;padding:10px 16px;">
                        <i class="bi bi-arrow-left"></i> Lista de Facturas
                     </a>`;

        if (f.estado === 'GUARDADA') {
            html += `<button class="btn" onclick="solicitarEmitir()"
                        style="background:#d1fae5;color:#065f46;font-weight:700;padding:10px 16px;">
                        <i class="bi bi-send-fill"></i> Emitir Factura
                     </button>`;
        }
        if (f.estado === 'EMITIDA') {
            html += `<button class="btn" onclick="descargarPdf()"
                        style="background:#fef3c7;color:#92400e;font-weight:700;padding:10px 16px;">
                        <i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF
                     </button>
                     <button class="btn btn-danger" onclick="solicitarAnular()"
                        style="padding:10px 16px;">
                        <i class="bi bi-x-circle-fill"></i> Anular Factura
                     </button>`;
        }

        bar.innerHTML = html;
    }

    // ── Emitir ───────────────────────────────────────────────────
    function solicitarEmitir() {
        confirmar('emit', '¿Emitir esta factura?',
            'Una vez emitida no se puede regresar a borrador.',
            ejecutarEmitir, 'Emitir', 'background:#059669;color:white;');
    }

    async function ejecutarEmitir() {
        // Mostrar estado de carga mientras se procesa y envía el correo
        const bar = document.getElementById('accionesBar');
        bar.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;
                        background:#e8f4fd;border-radius:8px;font-size:13px;color:#1468B1;font-weight:600;">
                <i class="bi bi-send-fill" style="animation:spin 1s linear infinite;font-size:16px"></i>
                Enviando factura y correo al cliente...
            </div>`;
        const h = authHeaders();
        try {
            const res = await fetch(`/api/facturas/${idFactura}/emitir`, {method:'POST', headers:h});
            if (res.ok) {
                await cargarFactura();
                mostrarAlerta('Factura emitida correctamente. El correo se envió al cliente.', 'success');
            } else {
                const err = await res.json();
                renderAcciones(); // restaurar botones
                mostrarAlerta(err.mensaje ?? 'Error al emitir la factura', 'error');
            }
        } catch(e) {
            renderAcciones(); // restaurar botones
            mostrarAlerta('Error de conexión', 'error');
        }
    }

    // ── PDF ──────────────────────────────────────────────────────
    async function descargarPdf() {
        const h = authHeaders();
        try {
            const res = await fetch(`/api/facturas/${idFactura}/pdf`, {headers:h});
            if (res.ok) {
                const blob = await res.blob();
                const url  = window.URL.createObjectURL(blob);
                const a    = document.createElement('a');
                a.href = url; a.download = `factura-${facturaData.numeroSecuencial ?? idFactura}.pdf`;
                a.click(); window.URL.revokeObjectURL(url);
            } else {
                mostrarAlerta('No se pudo generar el PDF', 'error');
            }
        } catch(e) { mostrarAlerta('Error de conexión', 'error'); }
    }

    // ── Anular ───────────────────────────────────────────────────
    function solicitarAnular() {
        confirmar('anular', '¿Anular esta factura?',
            'El stock de los productos será devuelto al inventario. Esta acción no se puede deshacer.',
            ejecutarAnular, 'Anular', 'background:#dc2626;color:white;');
    }

    async function ejecutarAnular() {
        const h = authHeaders();
        try {
            const res = await fetch(`/api/facturas/${idFactura}/anular`, {method:'PATCH', headers:h});
            if (res.ok) {
                await cargarFactura(); // recarga primero para que el estado se vea actualizado
                mostrarAlerta('Factura anulada. El stock fue restituido al inventario.', 'success');
            } else {
                const err = await res.json();
                mostrarAlerta(err.mensaje ?? 'Error al anular la factura', 'error');
            }
        } catch(e) { mostrarAlerta('Error de conexión', 'error'); }
    }

    cargarFactura();
</script>
</body>
</html>
