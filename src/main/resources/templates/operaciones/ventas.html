<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ventas')}"></head>
<body>
<div th:replace="~{layout :: sidebar('ventas')}"></div>

<div class="main">
    <div class="topbar">
        <h1>Ventas</h1>
        <span class="user-badge" id="userDisplay"></span>
    </div>

    <div class="card-box">
        <div class="card-box-header">
            <h2>Listado de Ventas</h2>
            <button class="btn btn-primary" onclick="abrirModalVenta()">+ Nueva Venta</button>
        </div>

        <!-- Filtros -->
        <div style="display:flex;gap:12px;padding:16px 24px;border-bottom:1px solid #f0f4f8;flex-wrap:wrap;">
            <input type="text" id="buscador" placeholder="Buscar por número o cliente..."
                   oninput="resetPagina()"
                   style="flex:1;min-width:200px;padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B"/>
            <select id="filtroSucursal" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B;min-width:160px">
                <option value="">Todas las sucursales</option>
            </select>
            <select id="filtroEstado" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B">
                <option value="">Todos los estados</option>
                <option value="PAGADA">Pagada</option>
                <option value="ANULADA">Anulada</option>
            </select>
            <select id="filtroSize" onchange="resetPagina()"
                    style="padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B">
                <option value="10">10 por página</option>
                <option value="25">25 por página</option>
                <option value="50">50 por página</option>
            </select>
        </div>

        <table>
            <thead>
            <tr>
                <th>N° Venta</th>
                <th>Cliente</th>
                <th>Sucursal</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Método Pago</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tablaVentas">
            <tr><td colspan="8" style="text-align:center;color:#aaa;padding:30px">Cargando...</td></tr>
            </tbody>
        </table>

        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid #f0f4f8;">
            <span id="infoPagina" style="font-size:13px;color:#888"></span>
            <div style="display:flex;gap:6px;" id="controlesPagina"></div>
        </div>
    </div>
</div>

<!-- Modal Nueva Venta -->
<div class="modal-overlay" id="modalVenta" style="align-items:flex-start;padding:20px;overflow-y:auto;">
    <div class="modal" style="max-width:700px;width:100%;">
        <h3>Nueva Venta</h3>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group">
                <label>Sucursal</label>
                <select id="ventaSucursal" onchange="cargarProductosSucursal()"></select>
            </div>
            <div class="form-group">
                <label>Método de Pago</label>
                <select id="ventaMetodoPago">
                    <option value="EFECTIVO">Efectivo</option>
                    <option value="TARJETA">Tarjeta</option>
                    <option value="TRANSFERENCIA">Transferencia</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Cliente</label>
            <select id="ventaCliente"></select>
        </div>

        <!-- Agregar producto -->
        <div style="background:#f8fafc;border-radius:8px;padding:16px;margin-bottom:16px;">
            <label style="font-size:12px;font-weight:600;color:#12274B;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:10px;">Agregar Producto</label>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <select id="selProducto" style="flex:2;min-width:180px;padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B"></select>
                <input type="number" id="selCantidad" placeholder="Cant." min="1" value="1"
                       style="width:80px;padding:8px 12px;border:1.5px solid #D0EDFC;border-radius:7px;font-size:13px;outline:none;color:#12274B"/>
                <button class="btn btn-primary" onclick="agregarProducto()">Agregar</button>
            </div>
        </div>

        <!-- Tabla de detalles -->
        <table id="tablaDetalles" style="margin-bottom:16px;">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="detallesBody">
            <tr><td colspan="5" style="text-align:center;color:#aaa;padding:16px">Sin productos</td></tr>
            </tbody>
        </table>

        <!-- Totales -->
        <div style="background:#f8fafc;border-radius:8px;padding:16px;margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
                <span style="color:#888">Subtotal:</span>
                <span id="resSubtotal">$0.00</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
                <span style="color:#888" id="resIvaLabel">IVA:</span>
                <span id="resIva">$0.00</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:#12274B;">
                <span>Total:</span>
                <span id="resTotal">$0.00</span>
            </div>
        </div>

        <div class="form-group">
            <label>Observación (opcional)</label>
            <input type="text" id="ventaObservacion" placeholder="Observación..."/>
        </div>

        <div class="modal-footer">
            <button class="btn" onclick="cerrarModalVenta()" style="background:#f0f4f8;color:#333">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarVenta()">Guardar Venta</button>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
<script>
    let paginaActual = 0;
    let totalPaginas = 0;
    let detalles = [];
    let ivaPorc = 15;
    let productos = [];

    function resetPagina() { paginaActual = 0; cargarDatos(); }

    async function cargarDatos() {
        const h = authHeaders();
        const search = document.getElementById('buscador').value;
        const idSucursal = document.getElementById('filtroSucursal').value;
        const estado = document.getElementById('filtroEstado').value;
        const size = document.getElementById('filtroSize').value;

        let url = `/api/ventas/paginado?page=${paginaActual}&size=${size}`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (idSucursal) url += `&idSucursal=${idSucursal}`;
        if (estado) url += `&estado=${estado}`;

        try {
            const res = await fetch(url, {headers: h});
            const data = await res.json();
            const page = data.datos ?? data;
            totalPaginas = page.totalPaginas;

            document.getElementById('infoPagina').textContent =
                `Mostrando ${page.contenido.length} de ${page.totalElementos} ventas — Página ${page.paginaActual + 1} de ${page.totalPaginas || 1}`;

            if (!page.contenido.length) {
                document.getElementById('tablaVentas').innerHTML =
                    '<tr><td colspan="8" style="text-align:center;color:#aaa;padding:30px">No se encontraron ventas</td></tr>';
                document.getElementById('controlesPagina').innerHTML = '';
                return;
            }

            document.getElementById('tablaVentas').innerHTML = page.contenido.map(v => `
                <tr>
                    <td>${v.numeroVenta}</td>
                    <td>${v.cliente}</td>
                    <td>${v.sucursal}</td>
                    <td>${new Date(v.fechaVenta).toLocaleDateString('es-EC')}</td>
                    <td>$${parseFloat(v.total).toFixed(2)}</td>
                    <td>${v.metodoPago}</td>
                    <td><span class="badge ${v.estado === 'PAGADA' ? 'badge-success' : 'badge-danger'}">${v.estado}</span></td>
                    <td style="display:flex;gap:6px;">
    ${v.estado === 'PAGADA' ? `
    <button class="btn btn-primary btn-sm" onclick="generarFactura(${v.idVenta})">Facturar</button>
    <button class="btn btn-danger btn-sm" onclick="anularVenta(${v.idVenta})">Anular</button>
    ` : '<span style="color:#aaa;font-size:12px">Anulada</span>'}
</td>
                </tr>
            `).join('');

            renderPaginacion();
        } catch(e) { console.error(e); }
    }

    function renderPaginacion() {
        const cont = document.getElementById('controlesPagina');
        let html = `<button class="btn btn-sm" onclick="irPagina(${paginaActual - 1})"
            ${paginaActual === 0 ? 'disabled style="opacity:0.4"' : ''}
            style="background:#f0f4f8;color:#333">Anterior</button>`;
        for (let i = 0; i < totalPaginas; i++) {
            if (totalPaginas <= 7 || Math.abs(i - paginaActual) <= 2) {
                html += `<button class="btn btn-sm" onclick="irPagina(${i})"
                    style="background:${i === paginaActual ? '#1468B1' : '#f0f4f8'};color:${i === paginaActual ? 'white' : '#333'}">${i + 1}</button>`;
            }
        }
        html += `<button class="btn btn-sm" onclick="irPagina(${paginaActual + 1})"
            ${paginaActual >= totalPaginas - 1 ? 'disabled style="opacity:0.4"' : ''}
            style="background:#f0f4f8;color:#333">Siguiente</button>`;
        cont.innerHTML = html;
    }

    async function generarFactura(idVenta) {
        const h = authHeaders();
        try {
            const res = await fetch(`/api/facturas/generar/${idVenta}`, {method: 'POST', headers: h});
            if (res.ok) {
                alert('Factura generada correctamente');
                window.location.href = '/facturas';
            } else {
                const err = await res.json();
                alert(err.mensaje ?? 'Error al generar factura');
            }
        } catch(e) { alert('Error de conexión'); }
    }

    function irPagina(p) {
        if (p < 0 || p >= totalPaginas) return;
        paginaActual = p;
        cargarDatos();
    }

    async function cargarFiltros() {
        const h = authHeaders();
        const [sucs, clientes, ivaRes] = await Promise.all([
            fetch('/api/sucursales', {headers: h}).then(r => r.json()),
            fetch('/api/clientes', {headers: h}).then(r => r.json()),
            fetch('/api/configuracion-iva/activa', {headers: h}).then(r => r.json())
        ]);

        const sucursales = sucs.datos ?? sucs;
        const sucOpts = sucursales.map(s => `<option value="${s.idSucursal}">${s.nombre}</option>`).join('');
        document.getElementById('filtroSucursal').innerHTML = '<option value="">Todas las sucursales</option>' + sucOpts;
        document.getElementById('ventaSucursal').innerHTML = sucOpts;

        const clientesData = clientes.datos ?? clientes;
        document.getElementById('ventaCliente').innerHTML = clientesData.map(c =>
            `<option value="${c.idCliente}">${c.nombres} ${c.apellidos ?? ''} - ${c.identificacion}</option>`
        ).join('');

        if (ivaRes.datos) ivaPorc = ivaRes.datos.porcentaje;
        document.getElementById('resIvaLabel').textContent = `IVA (${ivaPorc}%):`;

        await cargarProductosSucursal();
    }

    async function cargarProductosSucursal() {
        const h = authHeaders();
        const res = await fetch('/api/productos', {headers: h});
        const data = await res.json();
        productos = data.datos ?? data;
        document.getElementById('selProducto').innerHTML = productos.map(p =>
            `<option value="${p.idProducto}" data-precio="${p.precioVenta}">${p.nombre} - $${parseFloat(p.precioVenta).toFixed(2)}</option>`
        ).join('');
    }

    function agregarProducto() {
        const sel = document.getElementById('selProducto');
        const idProducto = parseInt(sel.value);
        const cantidad = parseInt(document.getElementById('selCantidad').value);
        const nombre = sel.options[sel.selectedIndex].text.split(' - ')[0];
        const precio = parseFloat(sel.options[sel.selectedIndex].dataset.precio);

        if (!cantidad || cantidad < 1) { alert('Ingresa una cantidad válida'); return; }

        const existente = detalles.find(d => d.idProducto === idProducto);
        if (existente) {
            existente.cantidad += cantidad;
            existente.subtotal = existente.precioUnitario * existente.cantidad;
        } else {
            detalles.push({ idProducto, nombre, precioUnitario: precio, cantidad, subtotal: precio * cantidad });
        }

        renderDetalles();
    }

    function quitarProducto(idx) {
        detalles.splice(idx, 1);
        renderDetalles();
    }

    function renderDetalles() {
        if (!detalles.length) {
            document.getElementById('detallesBody').innerHTML =
                '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:16px">Sin productos</td></tr>';
            actualizarTotales();
            return;
        }
        document.getElementById('detallesBody').innerHTML = detalles.map((d, i) => `
            <tr>
                <td>${d.nombre}</td>
                <td>$${d.precioUnitario.toFixed(2)}</td>
                <td>${d.cantidad}</td>
                <td>$${d.subtotal.toFixed(2)}</td>
                <td><button class="btn btn-danger btn-sm" onclick="quitarProducto(${i})">x</button></td>
            </tr>
        `).join('');
        actualizarTotales();
    }

    function actualizarTotales() {
        const subtotal = detalles.reduce((s, d) => s + d.subtotal, 0);
        const iva = subtotal * (ivaPorc / 100);
        const total = subtotal + iva;
        document.getElementById('resSubtotal').textContent = `$${subtotal.toFixed(2)}`;
        document.getElementById('resIva').textContent = `$${iva.toFixed(2)}`;
        document.getElementById('resTotal').textContent = `$${total.toFixed(2)}`;
    }

    function abrirModalVenta() {
        detalles = [];
        renderDetalles();
        document.getElementById('modalVenta').classList.add('open');
    }

    function cerrarModalVenta() {
        document.getElementById('modalVenta').classList.remove('open');
    }

    async function guardarVenta() {
        if (!detalles.length) { alert('Agrega al menos un producto'); return; }
        const h = authHeaders();
        const body = {
            idCliente: parseInt(document.getElementById('ventaCliente').value),
            idSucursal: parseInt(document.getElementById('ventaSucursal').value),
            metodoPago: document.getElementById('ventaMetodoPago').value,
            observacion: document.getElementById('ventaObservacion').value,
            detalles: detalles.map(d => ({ idProducto: d.idProducto, cantidad: d.cantidad }))
        };

        try {
            const res = await fetch('/api/ventas', {method: 'POST', headers: h, body: JSON.stringify(body)});
            if (res.ok) {
                cerrarModalVenta();
                cargarDatos();
            } else {
                const err = await res.json();
                alert(err.mensaje ?? 'Error al guardar la venta');
            }
        } catch(e) { alert('Error de conexión'); }
    }

    async function anularVenta(id) {
        if (!confirm('¿Está seguro de anular esta venta?')) return;
        const h = authHeaders();
        try {
            const res = await fetch(`/api/ventas/${id}/anular`, {method: 'PATCH', headers: h});
            if (res.ok) cargarDatos();
            else alert('Error al anular la venta');
        } catch(e) { alert('Error de conexión'); }
    }

    cargarFiltros();
    cargarDatos();
</script>
</body>
</html>
